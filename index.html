<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>מחולל מסמכים ותמונות</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts (Rubik & Heebo) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;700&family=Rubik:wght@400;500;700&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Heebo', 'sans-serif'],
                        heading: ['Rubik', 'sans-serif'],
                    },
                    boxShadow: {
                        'a4': '0 10px 30px -5px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05)',
                    }
                }
            }
        }
    </script>
    
    <style>
        /* A4 Page Simulation Styling */
        .a4-page {
            width: 210mm;
            min-height: 297mm;
            background: white;
            box-sizing: border-box;
            margin: 0 auto 2rem auto;
            padding: 20mm;
            position: relative;
        }

        @media screen and (max-width: 850px) {
            .a4-page {
                width: 100%;
                min-height: auto;
                padding: 1rem;
                margin-bottom: 1rem;
            }
        }

        /* Styles dedicated strictly for Printing / Saving as PDF */
        @media print {
            html, body {
                background: white !important;
                padding: 0 !important;
                margin: 0 !important;
                -webkit-print-color-adjust: exact !important;
                print-color-adjust: exact !important;
            }

            /* Hide everything that is NOT the document preview */
            .no-print {
                display: none !important;
            }

            .print-area-wrapper {
                padding: 0 !important;
                margin: 0 !important;
                width: 100% !important;
                max-width: none !important;
                box-shadow: none !important;
            }

            .a4-page {
                width: 210mm !important;
                height: 297mm !important;
                min-height: 297mm !important;
                max-height: 297mm !important;
                box-shadow: none !important;
                border: none !important;
                border-radius: 0 !important;
                padding: 20mm !important;
                margin: 0 !important;
                box-sizing: border-box !important;
                page-break-after: always !important;
                break-after: page !important;
                page-break-inside: avoid !important;
                break-inside: avoid !important;
                overflow: hidden !important;
            }

            @page {
                size: A4 portrait;
                margin: 0;
            }
        }
    </style>
</head>
<body class="bg-slate-100 font-sans text-slate-800 min-h-screen flex flex-col">

    <!-- Custom Modal Container for System Messages -->
    <div id="customModal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm flex items-center justify-center z-50 hidden p-4">
        <div class="bg-white rounded-xl shadow-xl max-w-md w-full p-6 space-y-4 border border-slate-200">
            <div class="flex items-center gap-3 text-amber-600">
                <i class="fa-solid fa-circle-exclamation text-2xl"></i>
                <h3 class="text-lg font-bold font-heading text-slate-900">הודעת מערכת</h3>
            </div>
            <p id="modalMessage" class="text-sm text-slate-600 leading-relaxed"></p>
            <div class="flex justify-end pt-2">
                <button onclick="closeModal()" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white font-medium rounded-lg text-sm transition">אישור</button>
            </div>
        </div>
    </div>

    <!-- Header / Navbar -->
    <header class="bg-indigo-700 text-white shadow-md no-print sticky top-0 z-40">
        <div class="max-w-7xl mx-auto px-4 py-4 sm:px-6 lg:px-8 flex justify-between items-center">
            <div class="flex items-center space-x-3 space-x-reverse">
                <i class="fa-solid fa-file-invoice text-2xl text-indigo-200"></i>
                <h1 class="text-xl font-bold font-heading">מחולל מסמכים ותמונות</h1>
            </div>
            <div class="flex items-center space-x-3 space-x-reverse">
                <button onclick="resetForm()" class="px-3 py-2 text-sm bg-indigo-600 hover:bg-indigo-800 rounded-lg transition duration-200 flex items-center gap-2">
                    <i class="fa-solid fa-rotate-right"></i>
                    <span class="hidden sm:inline">איפוס</span>
                </button>
                <button onclick="printOrSavePDF()" class="px-4 py-2 text-sm bg-emerald-500 hover:bg-emerald-600 text-white font-medium rounded-lg shadow transition duration-200 flex items-center gap-2 cursor-pointer">
                    <i class="fa-solid fa-print text-lg"></i>
                    <span>הדפס / שמור כ-PDF</span>
                </button>
            </div>
        </div>
    </header>

    <!-- Main Content Area -->
    <main class="flex-grow max-w-7xl w-full mx-auto p-4 sm:p-6 lg:p-8">
        <div class="grid grid-cols-1 lg:grid-cols-12 gap-8 items-start">
            
            <!-- Sidebar Controls (Input Cards) -->
            <section class="lg:col-span-5 space-y-6 no-print">
                
                <!-- 1. Window for Name / Title -->
                <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-5 space-y-3">
                    <h2 class="text-base font-bold font-heading text-slate-800 flex items-center gap-2 border-b pb-2">
                        <i class="fa-solid fa-user text-indigo-600"></i>
                        1. שם / כותרת
                    </h2>
                    <div>
                        <input type="text" id="docName" placeholder="הכנס שם / כותרת..." 
                            class="w-full px-4 py-2.5 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition text-slate-800 font-medium"
                            oninput="updatePreview()">
                    </div>
                </div>

                <!-- 2. Controls for Formatting & Text Sizes -->
                <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-5 space-y-4">
                    <h2 class="text-base font-bold font-heading text-slate-800 flex items-center gap-2 border-b pb-2">
                        <i class="fa-solid fa-sliders text-indigo-600"></i>
                        2. הגדרות גודל טקסט
                    </h2>
                    
                    <!-- Title Size Slider -->
                    <div class="space-y-1">
                        <div class="flex justify-between text-xs font-semibold text-slate-600">
                            <span>גודל כותרת:</span>
                            <span id="titleSizeVal">28 פיקסלים</span>
                        </div>
                        <input type="range" id="titleSizeSlider" min="18" max="48" value="28" 
                            class="w-full accent-indigo-600 cursor-pointer" oninput="updatePreview()">
                    </div>

                    <!-- Body Size Slider -->
                    <div class="space-y-1">
                        <div class="flex justify-between text-xs font-semibold text-slate-600">
                            <span>גודל תוכן:</span>
                            <span id="bodySizeVal">16 פיקסלים</span>
                        </div>
                        <input type="range" id="bodySizeSlider" min="10" max="28" value="16" 
                            class="w-full accent-indigo-600 cursor-pointer" oninput="updatePreview()">
                    </div>
                </div>

                <!-- 3. Window for Details -->
                <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-5 space-y-3">
                    <h2 class="text-base font-bold font-heading text-slate-800 flex items-center gap-2 border-b pb-2">
                        <i class="fa-solid fa-align-right text-indigo-600"></i>
                        3. פרטים ותוכן המסמך
                    </h2>
                    <div>
                        <textarea id="docDetails" rows="8" placeholder="הכנס את הפרטים כאן..." 
                            class="w-full px-4 py-3 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition text-slate-800 leading-relaxed"
                            oninput="updatePreview()"></textarea>
                    </div>
                </div>

                <!-- 4. Window for Image Upload -->
                <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-5 space-y-3">
                    <h2 class="text-base font-bold font-heading text-slate-800 flex items-center gap-2 border-b pb-2">
                        <i class="fa-solid fa-image text-indigo-600"></i>
                        4. תמונה
                    </h2>
                    
                    <!-- Upload Box -->
                    <div class="border-2 border-dashed border-slate-300 rounded-xl p-4 text-center hover:border-indigo-400 transition cursor-pointer relative bg-slate-50" id="dropZone">
                        <input type="file" id="imageInput" accept="image/*" class="absolute inset-0 w-full h-full opacity-0 cursor-pointer" onchange="handleImageUpload(event)">
                        <div class="space-y-2 pointer-events-none">
                            <i class="fa-solid fa-cloud-arrow-up text-3xl text-indigo-500"></i>
                            <p class="text-sm font-medium text-slate-700">לחץ להעלאת תמונה או גרור לכאן</p>
                            <p class="text-xs text-slate-400">PNG, JPG, GIF</p>
                        </div>
                    </div>

                    <!-- Remove Image Button -->
                    <div id="imageControls" class="hidden pt-1">
                        <button onclick="removeImage()" class="w-full py-2 bg-red-50 text-red-600 text-sm border border-red-200 rounded-lg hover:bg-red-100 transition flex items-center justify-center gap-2">
                            <i class="fa-solid fa-trash-can"></i>
                            הסר תמונה
                        </button>
                    </div>
                </div>

            </section>

            <!-- Document Preview Area (Pages Container) -->
            <section class="lg:col-span-7 print-area-wrapper flex flex-col items-center relative">
                <div class="w-full flex justify-between items-center mb-3 no-print">
                    <span class="text-sm font-semibold text-slate-500 flex items-center gap-1">
                        <i class="fa-solid fa-eye"></i> תצוגה מקדימה (<span id="pageCountDisplay">דף 1</span>)
                    </span>
                    <button onclick="printOrSavePDF()" class="text-xs bg-emerald-600 hover:bg-emerald-700 text-white font-medium px-3 py-1.5 rounded shadow transition flex items-center gap-1">
                        <i class="fa-solid fa-print"></i> הדפס / שמור כ-PDF
                    </button>
                </div>

                <!-- Dynamic Pages Container -->
                <div id="pagesContainer" class="w-full flex flex-col items-center">
                    <!-- Dynamic A4 Page cards will be injected here -->
                </div>
            </section>

        </div>
    </main>

    <!-- JavaScript Logic -->
    <script>
        // State variables
        let uploadedImageSrc = '';

        // Modal Handler
        function showModal(msg) {
            document.getElementById('modalMessage').textContent = msg;
            document.getElementById('customModal').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('customModal').classList.add('hidden');
        }

        // Render multi-page A4 structure dynamically
        function updatePreview() {
            const nameInput = document.getElementById('docName').value.trim() || 'שם';
            const detailsInput = document.getElementById('docDetails').value;
            const titleFontSize = document.getElementById('titleSizeSlider').value;
            const bodyFontSize = document.getElementById('bodySizeSlider').value;

            // Update UI sliders indicator
            document.getElementById('titleSizeVal').textContent = titleFontSize + ' פיקסלים';
            document.getElementById('bodySizeVal').textContent = bodyFontSize + ' פיקסלים';

            const pagesContainer = document.getElementById('pagesContainer');
            pagesContainer.innerHTML = '';

            // Split content into paragraphs or blocks
            const paragraphs = detailsInput.split('\n');
            const formattedDate = 'תאריך הדפסה: ' + new Date().toLocaleDateString('he-IL');

            // Helper to build a page HTML element
            function createPageElement(pageNum) {
                const page = document.createElement('div');
                page.className = 'a4-page shadow-a4 border border-slate-200 flex flex-col justify-between rounded-sm overflow-hidden transition-all duration-300';
                
                const topWrapper = document.createElement('div');
                topWrapper.className = 'space-y-6 flex-grow';

                if (pageNum === 1) {
                    // Page 1 Header
                    const header = document.createElement('div');
                    header.className = 'border-b-2 border-indigo-700 pb-4';
                    
                    const titleEl = document.createElement('h1');
                    titleEl.className = 'font-bold font-heading text-slate-900 break-words';
                    titleEl.style.fontSize = titleFontSize + 'px';
                    titleEl.textContent = nameInput;
                    header.appendChild(titleEl);
                    topWrapper.appendChild(header);

                    // Image container on first page if uploaded
                    if (uploadedImageSrc) {
                        const imgContainer = document.createElement('div');
                        imgContainer.className = 'overflow-hidden rounded-lg border border-slate-200 bg-slate-50 max-h-[300px] flex justify-center items-center my-4';
                        const img = document.createElement('img');
                        img.src = uploadedImageSrc;
                        img.className = 'max-w-full max-h-[300px] object-contain h-auto';
                        imgContainer.appendChild(img);
                        topWrapper.appendChild(imgContainer);
                    }
                } else {
                    // Secondary Pages Sub-header
                    const subHeader = document.createElement('div');
                    subHeader.className = 'border-b border-slate-300 pb-2 flex justify-between items-center text-xs text-slate-400';
                    subHeader.innerHTML = `<span>${nameInput}</span><span>עמוד ${pageNum}</span>`;
                    topWrapper.appendChild(subHeader);
                }

                // Content Box
                const contentBox = document.createElement('div');
                contentBox.className = 'text-slate-800 leading-relaxed break-words text-right whitespace-pre-wrap';
                contentBox.style.fontSize = bodyFontSize + 'px';
                topWrapper.appendChild(contentBox);

                page.appendChild(topWrapper);

                // Footer
                const footer = document.createElement('div');
                footer.className = 'border-t border-slate-200 pt-3 mt-4 flex justify-between items-center text-xs text-slate-400 no-print-footer';
                footer.innerHTML = `<span>עמוד ${pageNum}</span><span>${formattedDate}</span>`;
                page.appendChild(footer);

                return { page, contentBox };
            }

            // Paginate content dynamically based on available height
            let currentPageNum = 1;
            let currentObj = createPageElement(currentPageNum);
            pagesContainer.appendChild(currentObj.page);

            if (!detailsInput.trim()) {
                currentObj.contentBox.textContent = 'הפרטים שתקליד יוצגו כאן...';
                currentObj.contentBox.classList.add('text-slate-400', 'italic');
            } else {
                // A4 content height threshold (~850px inner content height)
                const MAX_PAGE_HEIGHT = 800;

                paragraphs.forEach((paragraph, idx) => {
                    const textNode = document.createTextNode(paragraph + (idx < paragraphs.length - 1 ? '\n' : ''));
                    currentObj.contentBox.appendChild(textNode);

                    // Check for height overflow
                    if (currentObj.page.scrollHeight > MAX_PAGE_HEIGHT && currentObj.contentBox.childNodes.length > 1) {
                        // Remove last appended text node and move to new page
                        currentObj.contentBox.removeChild(textNode);
                        
                        currentPageNum++;
                        currentObj = createPageElement(currentPageNum);
                        pagesContainer.appendChild(currentObj.page);
                        
                        currentObj.contentBox.appendChild(textNode);
                    }
                });
            }

            document.getElementById('pageCountDisplay').textContent = `${currentPageNum} עמודים`;
        }

        // Handle Image Upload
        function handleImageUpload(event) {
            const file = event.target.files[0];
            if (file && file.type.startsWith('image/')) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    uploadedImageSrc = e.target.result;
                    displayImageControls();
                    updatePreview();
                };
                reader.readAsDataURL(file);
            }
        }

        function displayImageControls() {
            document.getElementById('imageControls').classList.remove('hidden');
        }

        // Remove Image
        function removeImage() {
            uploadedImageSrc = '';
            document.getElementById('imageInput').value = '';
            document.getElementById('imageControls').classList.add('hidden');
            updatePreview();
        }

        // Print or Save as PDF Logic
        function printOrSavePDF() {
            try {
                if (window.top && window.top.print) {
                    window.top.print();
                } else {
                    window.print();
                }
            } catch (e) {
                try {
                    window.print();
                } catch (err) {
                    showModal("חלון ההדפסה נחסם עקב הגדרות אבטחה. אנא השתמש במקשים Ctrl + P (או Cmd + P במק).");
                }
            }
        }

        // Reset All Fields
        function resetForm() {
            document.getElementById('docName').value = '';
            document.getElementById('docDetails').value = '';
            document.getElementById('titleSizeSlider').value = 28;
            document.getElementById('bodySizeSlider').value = 16;
            removeImage();
            updatePreview();
        }

        // Drag and Drop Zone Enhancements
        const dropZone = document.getElementById('dropZone');

        ['dragenter', 'dragover'].forEach(eventName => {
            dropZone.addEventListener(eventName, (e) => {
                e.preventDefault();
                dropZone.classList.add('border-indigo-500', 'bg-indigo-50');
            }, false);
        });

        ['dragleave', 'drop'].forEach(eventName => {
            dropZone.addEventListener(eventName, (e) => {
                e.preventDefault();
                dropZone.classList.remove('border-indigo-500', 'bg-indigo-50');
            }, false);
        });

        dropZone.addEventListener('drop', (e) => {
            const dt = e.dataTransfer;
            const files = dt.files;
            if (files.length > 0 && files[0].type.startsWith('image/')) {
                document.getElementById('imageInput').files = files;
                handleImageUpload({ target: { files: files } });
            }
        });

        // Initial preview render
        window.onload = function() {
            updatePreview();
        };
    </script>
</body>
</html>
